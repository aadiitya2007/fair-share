<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <script>
        const savedTheme = localStorage.getItem('theme');
        const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fair Share</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=41">
</head>
<body>
    <nav class="navbar navbar-expand-lg app-navbar mb-4">
        <div class="container app-container">
            <a class="navbar-brand fw-bold d-flex align-items-center py-0" href="/" style="font-family: system-ui, -apple-system, sans-serif;">
                <img src="/static/img/fs_icon.png" alt="FS Logo" style="height: 40px; width: auto; object-fit: contain; margin-right: 8px;">
                <span style="color: var(--text-primary); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Fair</span><span style="color: #00b488; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Share</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    
                    <!-- Notifications Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-ghost btn-sm rounded-pill px-2 position-relative" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-bell fs-5"></i>
                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none" id="notifBadge">
                                <span class="visually-hidden">New alerts</span>
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2 p-0" aria-labelledby="notifDropdown" id="notifMenu" style="width: 300px; max-height: 400px; overflow-y: auto;">
                            <li class="p-3 text-center text-muted small" id="notifEmpty">No new notifications</li>
                        </ul>
                    </div>

                    <button class="btn btn-ghost btn-sm rounded-pill px-3" id="theme-toggle">
                        <i class="bi bi-moon-stars"></i> Theme
                    </button>
                    {% if request.session.get('user_id') and user %}
                    
                    <a href="/profile" class="text-decoration-none d-flex align-items-center gap-2">
                        <div class="user-avatar shadow-sm" data-name="{{ user.first_name if user.first_name else "User" }}">{{ user.first_name[0] if user.first_name else "U" }}</div>
                        <span class="fw-bold text-primary d-none d-lg-block">{{ user.first_name }}</span>
                    </a>
                    <a href="/logout" class="btn btn-ghost btn-sm rounded-pill px-3" onclick="return confirm('Are you sure you want to log out?');">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                    
                    {% else %}
                    <a href="/login" class="btn btn-ghost btn-sm rounded-pill px-3">Login</a>
                    <a href="/signup" class="btn btn-primary-custom btn-sm rounded-pill px-3">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <div class="container app-container pb-5">
        
        
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
<script>
    window.flashMessage = "{{ msg if msg else '' }}";
    window.flashError = "{{ error if error else '' }}";
</script>

    <script src="/static/js/theme.js?v=41"></script>
    <script src="/static/js/app.js?v=41"></script>
</body>
</html>
