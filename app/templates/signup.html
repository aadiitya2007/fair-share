{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center stagger-item mt-4 mb-5">
    <div class="col-md-6">
        <div class="surface-card p-4">
            <h1 class="fw-bold text-center mb-4" style="color: var(--text-primary);">Create Account</h1>
            
            {% if error %}
            <div class="alert alert-danger p-3 mb-4 rounded-3 d-flex align-items-center" role="alert" aria-live="assertive">
                <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i> 
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/signup" method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-sm-6 form-floating">
                        <input type="text" class="form-control" name="first_name" id="first_name" placeholder="First Name" required>
                        <label for="first_name" class="ms-2">First Name</label>
                    </div>
                    <div class="col-sm-6 form-floating">
                        <input type="text" class="form-control" name="last_name" id="last_name" placeholder="Last Name" required>
                        <label for="last_name" class="ms-2">Last Name</label>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="user_name" id="user_name" placeholder="Username" required>
                    <label for="user_name">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" name="email" id="email" placeholder="Email Address" required>
                    <label for="email">Email Address</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="date" class="form-control" name="dob" id="dob" required>
                    <label for="dob">Date of Birth</label>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6 form-floating">
                        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                        <label for="password" class="ms-2">Password</label>
                    </div>
                    <div class="col-sm-6 form-floating">
                        <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm Password" required>
                        <label for="confirm_password" class="ms-2">Confirm Password</label>
                    </div>
                </div>

                <button class="btn btn-primary-custom fw-bold text-white shadow-sm w-100 py-3 fs-5" type="submit">Sign Up</button>
            </form>
            <p class="mt-4 mb-0 text-center text-muted">Already have an account? <a href="/login" class="fw-bold">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
