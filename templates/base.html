<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fair Share | DBMS Project</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-body border-bottom shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">
                <img src="/static/img/fair_share_logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2 rounded-circle">
                Fair Share
            </a>
            <button class="btn btn-outline-secondary btn-sm" id="theme-toggle">🌓 Dark Mode</button>
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
        // Simple Dark/Light Theme Toggle for Viva
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const htmlTag = document.documentElement;
            const newTheme = htmlTag.getAttribute('data-bs-theme') === 'light' ? 'dark' : 'light';
            htmlTag.setAttribute('data-bs-theme', newTheme);
        });
    </script>
</body>
</html>
